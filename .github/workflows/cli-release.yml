name: CLI release

# A merge to main that changes the CLI's version releases it: binaries for
# every platform on the GitHub release cli-v<version>, which
# https://cobaltforge.dev/install.sh downloads.
on:
  push:
    branches: [main]
    paths: [packages/cli/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          echo "tag=cli-v$version" >> "$GITHUB_OUTPUT"
          if gh release view "cli-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "cli-v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.new == 'true'
        run: bun test packages/cli
      - if: steps.version.outputs.new == 'true'
        run: bun scripts/cli-release.ts
      - if: steps.version.outputs.new == 'true'
        name: Smoke test
        run: |
          ./dist/cli/cb-linux-x64 --version
          ./dist/cli/cb-linux-x64 commands --json > /dev/null
      - if: steps.version.outputs.new == 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/cli/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "cb ${TAG#cli-v}" \
            --notes "Install or update: \`curl -fsSL https://cobaltforge.dev/install.sh | sh\` (Windows: \`irm https://cobaltforge.dev/install.ps1 | iex\`)." \
            --latest
